<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:72},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;projekti&quot;,&quot;options&quot;:[&quot;projekti&quot;,&quot;vile&quot;,&quot;lokacija&quot;,&quot;novosti&quot;,&quot;onama&quot;,&quot;kontakt&quot;,&quot;&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false };
  renderVals() {
    const a = this.props.active ?? '';
    const c = (k) => a === k ? '#D3B574' : '#FFFFFF';
    return {
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
      cProjekti: c('projekti'), cVile: c('vile'), cLokacija: c('lokacija'), cNovosti: c('novosti'), cOnama: c('onama'), cKontakt: c('kontakt')
    };

}
